# Standardoc — recommended GitHub labels for Issues and Pull Requests.
#
# Synced automatically by `.github/workflows/labels-sync.yml` whenever this
# file changes on `main`. Manually-added labels survive (DELETE_OBSOLETE off).
#
# Philosophy: small, opinionated set. Too many labels = nobody uses them.
# Add more only when a clear use case emerges.

# ── Type — what kind of contribution / issue ──────────────────────────────
- name: bug
  color: 'd73a4a'
  description: 'Something isn''t working as documented'
- name: enhancement
  color: 'a2eeef'
  description: 'New feature or improvement to existing behavior'
- name: documentation
  color: '0075ca'
  description: 'README, CHANGELOG, code docs, examples — text-only changes'
- name: question
  color: 'd876e3'
  description: 'Usage question — consider GitHub Discussions instead'
- name: discussion
  color: 'cccccc'
  description: 'Open-ended design / architecture conversation'
- name: dependencies
  color: '0366d6'
  description: 'Dependency bump (Cargo, npm, GitHub Actions)'
- name: breaking-change
  color: 'b60205'
  description: 'PR introduces breaking API or behavior changes'

# ── Status — where the issue is in the triage / fix loop ──────────────────
- name: triage
  color: 'fbca04'
  description: 'Needs initial maintainer review'
- name: needs-info
  color: 'd4c5f9'
  description: 'Waiting on additional context from the reporter'
- name: blocked
  color: 'b60205'
  description: 'Blocked on external decision, upstream fix, or another issue'
- name: ready
  color: '0e8a16'
  description: 'Triage done, scoped, ready for someone to pick up'
- name: in-progress
  color: 'fbca04'
  description: 'Active work in progress (assigned)'
- name: wontfix
  color: 'ffffff'
  description: 'Not aligned with project direction — closed without action'
- name: duplicate
  color: 'cfd3d7'
  description: 'Already tracked elsewhere'
- name: invalid
  color: 'e4e669'
  description: 'Not reproducible / out of scope / spam'

# ── Community signals ─────────────────────────────────────────────────────
- name: good first issue
  color: '7057ff'
  description: 'Newcomer-friendly — small scope, well-defined, mentor available'
- name: help wanted
  color: '008672'
  description: 'Maintainers welcome contribution from the community'

# ── Area — which subsystem the issue / PR touches ─────────────────────────
- name: 'area/core'
  color: '5319e7'
  description: 'standardoc-core (storage, pipeline, watcher, query)'
- name: 'area/ir'
  color: '5319e7'
  description: 'standardoc-ir (IR types, FQDN, edges, symbols)'
- name: 'area/cli'
  color: '5319e7'
  description: 'standardoc-cli (single binary `stdoc` with sub-commands)'
- name: 'area/lsp'
  color: '5319e7'
  description: 'LSP daemon (writer, hover, navigation, diagnostics)'
- name: 'area/mcp'
  color: '5319e7'
  description: 'MCP daemon (find_symbol, get_context, agent integration)'
- name: 'area/lang/rust'
  color: '5319e7'
  description: 'Rust language provider (syn-based)'
- name: 'area/lang/ts'
  color: '5319e7'
  description: 'TypeScript / JavaScript provider (swc-based)'
- name: 'area/ext-vscode'
  color: '5319e7'
  description: 'VSCode extension (TypeScript, daemon supervisor, init flow)'
- name: 'area/build'
  color: '5319e7'
  description: 'CI, release pipeline, dependency management'
- name: 'area/docs'
  color: '5319e7'
  description: 'README, CHANGELOG, project notes — pure documentation'

# ── Special ───────────────────────────────────────────────────────────────
- name: upstream
  color: 'fef2c0'
  description: 'Root cause is in a dependency (syn, swc, rmcp, tower-lsp, …)'
- name: 'needs-mvce'
  color: 'd4c5f9'
  description: 'Needs minimal verifiable example to reproduce'
- name: release
  color: '0e8a16'
  description: 'PR creates or finalizes a release'
