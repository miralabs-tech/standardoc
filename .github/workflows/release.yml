name: Release

# Triggered when a tag matching `v*` is pushed (e.g. `v1.0.0-beta.1`).
# Publishes `standardoc-cli` to crates.io and creates a GitHub Release with
# notes pulled from CHANGELOG.md.
#
# Beta.1 distribution is `cargo install standardoc-cli` (compile from source
# on the user's machine). Pre-built cross-platform binaries are deferred
# post-beta.1 — re-introduce here when feedback demands it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.91'

      - uses: Swatinem/rust-cache@v2

      - name: cargo publish (dry-run)
        run: cargo publish --dry-run -p standardoc-cli

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p standardoc-cli

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the section between `## [VERSION]` and the next `## ` header.
          awk "/^## \\[$version\\]/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $GITHUB_REF_NAME — see CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
