name: Docs render

on:
  # PR: no `paths:` filter → render-check runs on every PR. Lets us mark it
  # as a required status check in branch protection without falling into the
  # "missing-check-blocks-merge" trap on PRs that don't touch docs paths.
  pull_request:
  # main: filter to avoid auto-commit cycles on irrelevant changes.
  push:
    branches: [main]
    paths:
      - 'docs-src/**'
      - 'crates/**'
      - 'examples/**'
      - 'scripts/render-docs.sh'
      - '.standardoc.json'

jobs:
  # On PR: just verify the templates render without crashing. Outputs are
  # gitignored so a `git diff` would always be non-empty here — drift is
  # not a useful gate. Render failures (DSL errors, missing keys) still
  # surface as a non-zero exit from the script.
  render-check:
    name: Render check (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render docs from docs-src/
        run: ./scripts/render-docs.sh

  # On push to main (= after PR merge): render and force-commit the
  # generated `.md` files over the gitignore so they stay visible on the
  # GitHub repo view. `[skip ci]` in the message prevents this auto-commit
  # from re-triggering the workflow and looping.
  render-and-commit:
    name: Render + auto-commit (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render docs from docs-src/
        run: ./scripts/render-docs.sh
      - name: Commit and push rendered .md (force-add over .gitignore)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f README.md README.fr.md docs/ai-integration.md docs/ai-integration.fr.md docs/cli-reference.md docs/cli-reference.fr.md docs/mcp-reference.md docs/mcp-reference.fr.md
          if git diff --staged --quiet; then
            echo "No render changes."
            exit 0
          fi
          git commit -m "docs: re-render from docs-src/ [skip ci]"
          git push
