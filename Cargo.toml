[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-MIT"
repository = "https://github.com/miralabs-tech/standardoc"
homepage = "https://standardoc.miralabs.tech"
authors = ["miralabs.tech"]
rust-version = "1.89"

# Local crates only at scaffold time. External deps (serde, blake3, rusqlite,
# r2d2, notify, syn, swc_*, wasmtime, ...) get pinned here as each subject
# starts consuming them — no spec deps day-1.
[workspace.dependencies]
standardoc-ir            = { version = "0.1.0", path = "crates/standardoc-ir" }
standardoc-bridge-sdk    = { version = "0.0.1", path = "crates/standardoc-bridge-sdk" }
standardoc-lang-provider = { version = "0.1.0", path = "crates/standardoc-lang-provider" }
standardoc-core          = { version = "0.1.0", path = "crates/standardoc-core" }

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Shared lint policy. Each crate opts in via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
# `unreachable_pub` (rustc) and `redundant_pub_crate` (clippy) contradict each
# other on internal items of a binary crate. We prefer explicit `pub(crate)`.
redundant_pub_crate = "allow"

# Style allows kept from v0.1.0-rc — revisit once the rewrite stabilises.
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
manual_let_else = "allow"
option_if_let_else = "allow"
default_trait_access = "allow"
unnecessary_struct_initialization = "allow"
needless_collect = "allow"
