[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2024"
license = "LicenseRef-FSL-1.1-MIT"
repository = "https://github.com/miralabs-tech/standardoc"
homepage = "https://standardoc.miralabs.tech"
authors = ["miralabs.tech"]
rust-version = "1.91"

# External deps (blake3, notify, syn, swc_*, wasmtime, ...) get pinned here as
# each subject starts consuming them — no spec deps day-1.
[workspace.dependencies]
standardoc-ir            = { version = "1.0.0-beta.2", path = "crates/standardoc-ir" }
standardoc-bridge-sdk    = { version = "1.0.0-beta.2", path = "crates/standardoc-bridge-sdk" }
standardoc-lang-provider = { version = "1.0.0-beta.2", path = "crates/standardoc-lang-provider" }
standardoc-core          = { version = "1.0.0-beta.2", path = "crates/standardoc-core" }
standardoc-server        = { version = "1.0.0-beta.2", path = "crates/standardoc-server" }
standardoc-graph-viz     = { version = "1.0.0-beta.2", path = "crates/standardoc-graph-viz" }
# Versioned independently of the core workspace per SOURCEMAP_v1.md §8 —
# protocol semver tracks the wire format, not the standardoc release train.
standardoc-sourcemap     = { version = "1.0.0", path = "crates/standardoc-sourcemap" }

serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
bincode     = "1.3"
uuid        = { version = "1", features = ["v4"] }
thiserror   = "2"
rusqlite    = { version = "0.39", features = ["bundled-full"] }
r2d2        = "0.8"
r2d2_sqlite = "0.33"
fs4         = "1"
tempfile    = "3"
tokio       = { version = "1", default-features = false, features = ["sync", "rt-multi-thread", "macros", "time", "io-std", "net"] }
tokio-util  = { version = "0.7", default-features = false }
tower-lsp-server = "0.23"
rmcp        = "1.7"
async-trait = "0.1"
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
http        = "1"
bytes       = "1"
axum        = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
schemars    = "1"
notify      = "8"
notify-debouncer-full = { version = "0.7", default-features = false, features = ["macos_fsevent"] }
rayon       = "1"
walkdir     = "2"
blake3      = "1"
syn         = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote       = "1"
swc_core    = { version = "65", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common", "common_concurrent"] }
full_moon   = { version = "2.2", features = ["luau", "luajit", "cfxlua"] }
tree-sitter   = "0.26"
tree-sitter-c = "0.24"
clap        = { version = "4", features = ["derive"] }
ctrlc       = "3"
ignore      = "0.4"
strsim      = "0.11"
standarbuild-detect = "0.3"
wasm-bindgen              = "0.2"
wasm-bindgen-futures      = "0.4"
js-sys                    = "0.3"
web-sys                   = "0.3"
console_error_panic_hook  = "0.1"
serde-wasm-bindgen        = "0.6"
wgpu                      = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
bytemuck                  = { version = "1.18", features = ["derive"] }
glam                      = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Shared lint policy. Each crate opts in via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
# `unreachable_pub` (rustc) and `redundant_pub_crate` (clippy) contradict each
# other on internal items of a binary crate. We prefer explicit `pub(crate)`.
redundant_pub_crate = "allow"

# Style allows kept from v0.1.0-rc — revisit once the rewrite stabilises.
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
manual_let_else = "allow"
option_if_let_else = "allow"
default_trait_access = "allow"
unnecessary_struct_initialization = "allow"
needless_collect = "allow"
