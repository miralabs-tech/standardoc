[package]
name = "standardoc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Standardoc CLI — single user-facing binary `stdoc`. Subcommands: index / watch / query / rescan / lsp / mcp / purge-excluded."
default-run = "stdoc"

[[bin]]
name = "stdoc"
path = "src/main.rs"

[dependencies]
standardoc-core          = { workspace = true }
standardoc-ir            = { workspace = true }
standardoc-lang-provider = { workspace = true }
standardoc-server        = { workspace = true }
clap                     = { workspace = true }
ctrlc                    = { workspace = true }
tokio                    = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = { workspace = true }

[lints]
workspace = true
