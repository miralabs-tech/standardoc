[package]
name = "standardoc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Standardoc CLI — single user-facing binary `standardoc`. Subcommands: index / watch / query / rescan / lsp / mcp / purge-excluded."
default-run = "standardoc"

[[bin]]
name = "standardoc"
path = "src/main.rs"

[dependencies]
standardoc-core          = { workspace = true }
standardoc-ir            = { workspace = true }
standardoc-lang-provider = { workspace = true }
standardoc-mcp-proxy     = { workspace = true }
standardoc-server        = { workspace = true }
clap                     = { workspace = true }
ctrlc                    = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
tokio                    = { workspace = true }
# `lsp-sxd` subcommand drives a standarx-dsl LSP loop with our
# downstream SxdSchema plugged in for schema-aware diagnostics.
standarx-dsl             = { workspace = true }
standarx-dsl-lsp         = { workspace = true }
# Pinned to match standarx-dsl-lsp's own tower-lsp version so the
# `lsp_types` types we use to construct hover payloads share the
# same vtable as the trait the Schema impl satisfies.
tower-lsp                = "0.20"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = { workspace = true }

[lints]
workspace = true
