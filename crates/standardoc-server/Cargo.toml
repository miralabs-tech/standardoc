serde            = { workspace = true }
serde_json       = { workspace = true }

[dev-dependencies]
standardoc-lang-provider = { workspace = true }
tempfile                 = { workspace = true }
serde_json               = { workspace = true }
tower                    = "0.5"

[lints]
workspace = true
