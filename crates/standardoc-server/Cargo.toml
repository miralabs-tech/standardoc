[package]
name = "standardoc-server"
description = "LSP + MCP + SSE daemon for Standardoc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "standardoc-server"
path = "src/main.rs"

[dependencies]
standardoc-core = { workspace = true }
standardoc-lang-rust = { version = "0.1.0", path = "../standardoc-lang-rust" }
standardoc-lang-ts = { version = "0.1.0", path = "../standardoc-lang-ts" }
standardoc-lang-python = { version = "0.1.0", path = "../standardoc-lang-python" }
standardoc-lang-tree-sitter = { version = "0.1.0", path = "../standardoc-lang-tree-sitter" }
standardoc-web = { version = "0.1.0", path = "../standardoc-web" }
serde = { workspace = true }
serde_json = { workspace = true }
tower-lsp = "0.20.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "net", "signal"] }
axum = "0.8.4"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
