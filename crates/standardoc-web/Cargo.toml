[package]
name = "standardoc-web"
description = "HTTP/SSE backend for Standardoc — REST API + live events. Bring your own frontend or use the Standardoc Pro UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Bundle the Pro frontend into the binary at build time. The frontend lives
# in `standardoc/web/dist/` (closed-source, distributed in the separate
# `standardoc-pro` repository). Enabled in Pro builds, disabled in OSS.
embedded-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
standardoc-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8.4", features = ["macros"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
futures-core = "0.3.31"
rust-embed = { version = "8.5.1", features = ["debug-embed", "interpolate-folder-path"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
syntect = { version = "5.2.0", default-features = false, features = ["default-fancy"] }

[lints]
workspace = true
