[package]
name = "standardoc-lang-rust"
description = "Rust language provider for Standardoc (powered by syn)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
standardoc-core = { workspace = true }
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "parsing"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
prettyplease = "0.2"

[lints]
workspace = true
