<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>standardoc — shell (multi-panel)</title>
    <style>
      /* Design tokens — inlined from @standarx/standardoc-viz/styles/tokens.
         Bun's resolver follows tsconfig `paths` first and can't pivot from
         the .ts-implying glob to a .scss target on a wildcard subpath, so
         tokens are duplicated here. Update this block AND the SCSS source
         together; component fallbacks (`var(--sd-foo, hardcoded)`) keep
         the rest of the lib functional regardless. */
      :root {
        --sd-bg: #1e1e1e;
        --sd-bg-elevated: #252526;
        --sd-bg-deep: #161616;
        --sd-fg: #cccccc;
        --sd-fg-muted: #9d9d9d;
        --sd-fg-strong: #ffffff;
        --sd-border: #454545;
        --sd-border-subtle: #2d2d2d;
        --sd-accent: #3794ff;
        --sd-accent-strong: #5aa9ff;
        --sd-hover: #2a2d2e;
        --sd-selection: #094771;
        --sd-status-ok: #89d185;
        --sd-status-warn: #cca700;
        --sd-status-err: #f48771;
        --sd-kind-module: #b180d7;
        --sd-kind-type: #cca700;
        --sd-kind-callable: #3794ff;
        --sd-kind-value: #89d185;
        --sd-kind-macro: #f48771;
        --sd-kind-unknown: #9d9d9d;
        --sd-ep-binary-main: #4a9eff;
        --sd-ep-public-api: #f5b942;
        --sd-ep-ffi-export: #ff8a3a;
        --sd-radius-sm: 3px;
        --sd-radius-md: 6px;
        --sd-radius-lg: 10px;
        --sd-radius-pill: 999px;
        --sd-space-1: 4px;
        --sd-space-2: 8px;
        --sd-space-3: 12px;
        --sd-space-4: 16px;
        --sd-space-5: 24px;
        --sd-space-6: 32px;
        --sd-text-xs: 10px;
        --sd-text-sm: 11px;
        --sd-text-md: 13px;
        --sd-text-lg: 15px;
        --sd-text-xl: 18px;
        --sd-font-mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
        --sd-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --sd-shell-grid-cols: 260px 1fr 360px;
        --sd-shell-grid-rows: 48px 1fr 1fr;
        --sd-shell-panel-min-h: 180px;
        --sd-shell-gap: var(--sd-space-2);
        --sd-panel-bg: var(--sd-bg);
        --sd-panel-header-h: 32px;
        --sd-panel-header-bg: var(--sd-bg-elevated);
        --sd-panel-padding: var(--sd-space-3);
        --sd-panel-border: 1px solid var(--sd-border-subtle);
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        background: #161616;
        color: #cccccc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      .sd-shell-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        background: #252526;
        border: 1px solid #2d2d2d;
        border-radius: 6px;
        height: 100%;
        box-sizing: border-box;
      }
      .sd-shell-toolbar__brand {
        color: #3794ff;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
      }
      .sd-shell-toolbar__spacer {
        flex: 1;
      }
      .sd-shell-toolbar standardoc-search {
        flex: 0 1 380px;
        max-width: 380px;
      }
      .sd-shell-panel-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        background: #1e1e1e;
        border: 1px solid #2d2d2d;
        border-radius: 6px;
        color: #9d9d9d;
        font-style: italic;
        padding: 16px;
        text-align: center;
      }
      standardoc-graph {
        display: block;
        width: 100%;
        height: 100%;
        background: #1e1e1e;
        border: 1px solid #2d2d2d;
        border-radius: 6px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <standardoc-panel-layout id="shell">
      <div data-slot="toolbar" class="sd-shell-toolbar">
        <span class="sd-shell-toolbar__brand">standardoc</span>
        <standardoc-search id="search" global-shortcut placeholder="Search symbols, files, types…"></standardoc-search>
        <span class="sd-shell-toolbar__spacer"></span>
        <span id="status" style="font-size: 11px; color: #9d9d9d;">booting…</span>
      </div>
      <standardoc-explorer id="explorer" data-slot="explorer"></standardoc-explorer>
      <standardoc-graph id="overview" data-slot="overview"></standardoc-graph>
      <div data-slot="focus" class="sd-shell-panel-placeholder">
        Focus Graph — Phase 3 (specialized FocusGraphCanvas).<br />
        For now the overview canvas above carries the whole graph.
      </div>
      <standardoc-symbol-details id="details" data-slot="details"></standardoc-symbol-details>
    </standardoc-panel-layout>
    <script type="module" src="/shell.js"></script>
  </body>
</html>
